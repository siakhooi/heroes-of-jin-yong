<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金庸群俠傳 Heroes of Jin Yong</title>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Noto Serif SC', serif;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated fog/mist effect */
        .mist {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(255,255,255,0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(255,255,255,0.02) 0%, transparent 40%),
                radial-gradient(ellipse at 60% 80%, rgba(255,255,255,0.02) 0%, transparent 45%);
            animation: mistMove 20s ease-in-out infinite;
        }

        @keyframes mistMove {
            0%, 100% { transform: translateX(0) translateY(0); }
            50% { transform: translateX(30px) translateY(-20px); }
        }

        /* Floating particles (like cherry blossoms or leaves) */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: linear-gradient(45deg, #e94560, #ff6b6b);
            border-radius: 50% 0 50% 50%;
            opacity: 0.6;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-100px) rotate(0deg) translateX(0);
                opacity: 0;
            }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% {
                transform: translateY(100vh) rotate(720deg) translateX(100px);
                opacity: 0;
            }
        }

        /* Main container */
        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            z-index: 10;
        }

        /* Chinese calligraphy style title */
        .chinese-title {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: clamp(3rem, 10vw, 7rem);
            color: #e94560;
            text-shadow:
                0 0 20px rgba(233, 69, 96, 0.5),
                0 0 40px rgba(233, 69, 96, 0.3),
                3px 3px 0 #1a1a2e;
            letter-spacing: 0.1em;
            animation: titleGlow 3s ease-in-out infinite;
            margin-bottom: 0.5rem;
        }

        @keyframes titleGlow {
            0%, 100% { text-shadow: 0 0 20px rgba(233, 69, 96, 0.5), 0 0 40px rgba(233, 69, 96, 0.3), 3px 3px 0 #1a1a2e; }
            50% { text-shadow: 0 0 30px rgba(233, 69, 96, 0.8), 0 0 60px rgba(233, 69, 96, 0.5), 3px 3px 0 #1a1a2e; }
        }

        .english-title {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            color: #eee;
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 3rem;
            opacity: 0.9;
        }

        /* Sword divider */
        .sword-divider {
            width: 200px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #e94560, transparent);
            position: relative;
            margin: 2rem 0;
        }

        .sword-divider::before {
            content: '⚔';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            color: #e94560;
            background: #16213e;
            padding: 0 1rem;
        }

        /* Coming Soon text */
        .coming-soon {
            font-size: clamp(1rem, 3vw, 1.5rem);
            color: #a0a0a0;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            margin-bottom: 2rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        /* Countdown timer */
        .countdown {
            display: flex;
            gap: 1rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .countdown-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(233, 69, 96, 0.3);
            border-radius: 10px;
            padding: 1rem 1.5rem;
            min-width: 80px;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: transform 0.3s, border-color 0.3s;
        }

        .countdown-item:hover {
            transform: translateY(-5px);
            border-color: rgba(233, 69, 96, 0.8);
        }

        .countdown-number {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 700;
            color: #e94560;
            display: block;
        }

        .countdown-label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* Quote section */
        .quote {
            max-width: 600px;
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.02);
            border-left: 3px solid #e94560;
            border-radius: 0 10px 10px 0;
        }

        .quote-text {
            font-size: 1.1rem;
            color: #ccc;
            font-style: italic;
            line-height: 1.8;
            margin-bottom: 1rem;
        }

        .quote-author {
            color: #e94560;
            font-size: 0.9rem;
        }

        /* Email signup */
        .signup {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .signup input {
            padding: 1rem 1.5rem;
            border: 1px solid rgba(233, 69, 96, 0.3);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 1rem;
            min-width: 250px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .signup input:focus {
            border-color: #e94560;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.2);
        }

        .signup input::placeholder {
            color: #666;
        }

        .signup button {
            padding: 1rem 2rem;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .signup button:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.4);
        }

        /* Navigation button */
        .nav-button {
            display: inline-block;
            padding: 1rem 3rem;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            color: #fff;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            text-decoration: none;
            letter-spacing: 0.1em;
            margin-bottom: 2rem;
        }

        .nav-button:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.4);
        }

        .button-group {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 2rem;
        }

        /* BGM + download */
        .audio-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 2rem;
            padding: 0.75rem 1.25rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(233, 69, 96, 0.25);
            border-radius: 50px;
            backdrop-filter: blur(10px);
        }

        .audio-row audio {
            flex: 1 1 200px;
            max-width: 320px;
            height: 40px;
            vertical-align: middle;
        }

        .audio-row .download-mp3 {
            display: inline-flex;
            align-items: center;
            padding: 0.65rem 1.25rem;
            border-radius: 50px;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            letter-spacing: 0.05em;
            white-space: nowrap;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .audio-row .download-mp3:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 24px rgba(233, 69, 96, 0.35);
        }

        /* Footer */
        .footer {
            position: absolute;
            bottom: 2rem;
            color: #555;
            font-size: 0.8rem;
            text-align: center;
        }

        /* Mountain silhouette */
        .mountains {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30vh;
            pointer-events: none;
            z-index: 1;
        }

        .mountain {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
        }

        .mountain svg {
            position: absolute;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="mist"></div>

    <div class="particles" id="particles"></div>

    <div class="mountains">
        <svg viewBox="0 0 1440 320" preserveAspectRatio="none" style="height: 200px; opacity: 0.3;">
            <path fill="#0f3460" d="M0,224L60,213.3C120,203,240,181,360,181.3C480,181,600,203,720,197.3C840,192,960,160,1080,165.3C1200,171,1320,213,1380,234.7L1440,256L1440,320L1380,320C1320,320,1200,320,1080,320C960,320,840,320,720,320C600,320,480,320,360,320C240,320,120,320,60,320L0,320Z"></path>
        </svg>
        <svg viewBox="0 0 1440 320" preserveAspectRatio="none" style="height: 150px; opacity: 0.2;">
            <path fill="#1a1a2e" d="M0,288L48,272C96,256,192,224,288,197.3C384,171,480,149,576,165.3C672,181,768,235,864,250.7C960,267,1056,245,1152,224C1248,203,1344,181,1392,170.7L1440,160L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
        </svg>
    </div>

    <div class="container">
        <h1 class="chinese-title">金庸群俠傳</h1>
        <h2 class="english-title">Heroes of Jin Yong</h2>

        <div class="sword-divider"></div>

        <div class="quote">
            <p class="quote-text">"The path of martial arts is long, but those who persevere shall reach the summit."</p>
            <p class="quote-author">— The World of Wuxia</p>
        </div>

        <div class="button-group">
            <a href="guide1/index.html" class="nav-button">完全攻略（繁體）</a>
            <a href="guide2/index.html" class="nav-button">完全攻略（简体）</a>
            <a href="midi/index.html" class="nav-button">🎵 遊戲音樂</a>
            <a href="tools/index.html" class="nav-button">🛠️ 工具下載</a>
        </div>

        <div class="audio-row">
            <audio id="bgm" src="mp3/金庸群侠传.mp3" controls autoplay playsinline preload="auto"></audio>
            <a class="download-mp3" href="mp3/金庸群侠传.mp3" download="金庸群侠传.mp3">下載 MP3</a>
        </div>

        <p class="footer">© 2026 Heroes of Jin Yong. All legends await.</p>
    </div>

    <script>
        // Create floating particles (cherry blossom petals)
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 15;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.transform = `scale(${Math.random() * 0.5 + 0.5})`;
                container.appendChild(particle);
            }
        }

        // Initialize
        createParticles();

        // Autoplay (may be blocked until user gesture; controls remain available)
        const bgm = document.getElementById('bgm');
        if (bgm) {
            bgm.play().catch(function () { /* policy or load */ });
        }
    </script>
</body>
</html>
